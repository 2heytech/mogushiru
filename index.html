<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>モグシル｜料理を選ぶだけで栄養バランスがわかる</title>
    <meta name="description" content="料理を選んで組み合わせるだけで、1日のカロリーとPFCバランス、栄養素の過不足がすぐ分かる栄養シミュレーター。登録不要・無料です。" />
    <meta name="theme-color" content="#FFF8EE" />
    <link rel="canonical" href="https://mogushiru.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 最初の画面に要るデータは、画面のプログラムを待たずに読み始める（src/data/catalog.ts の fetch と同じ指定）。画面の CSS・JS を先に届けるため優先度は低くする -->
    <link rel="preload" href="/data/dishes.json" as="fetch" crossorigin fetchpriority="low" />
    <link rel="preload" href="/data/foods.json" as="fetch" crossorigin fetchpriority="low" />
    <link rel="preload" href="/data/products.json" as="fetch" crossorigin fetchpriority="low" />
    <!-- SNS で共有したときの表示（OGP） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="モグシル" />
    <meta property="og:title" content="モグシル｜料理を選ぶだけで栄養バランスがわかる" />
    <meta property="og:description" content="料理を選んで組み合わせるだけで、1日のカロリーとPFCバランス、栄養素の過不足がすぐ分かる栄養シミュレーター。登録不要・無料です。" />
    <meta property="og:url" content="https://mogushiru.app/" />
    <meta property="og:image" content="https://mogushiru.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ごはん茶碗のキャラクター「ちゃわんモグ」と、モグシルのロゴ、朝・昼・晩の料理の絵" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
