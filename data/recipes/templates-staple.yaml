# 料理の型（主食・麺・丼・パン）。書き方は templates-main.yaml と同じ。

# おにぎり（ごはん110g＋のり＋塩＋具）
- template: onigiri
  name: "{name}おにぎり"
  kana: "{kana}おにぎり"
  category: staple
  suggestedSlots: [breakfast, lunch, other]
  ingredients:
    - { foodId: "01088", grams: 110, role: ごはん }
    - { foodId: "09004", grams: 1 } # 焼きのり
    - { foodId: "17012", grams: 0.3 } # 食塩
    - { foodId: "{food}", grams: "{grams}", role: 具 }
  variants:
    - { id: tuna-mayo, name: ツナマヨ, kana: つなまよ, food: "10263", grams: 15, extra: [{ foodId: "17042", grams: 5 }] }
    - { id: konbu, name: 昆布, kana: こんぶ, food: "09023", grams: 8 } # こんぶ つくだ煮
    - { id: okaka, name: おかか, kana: おかか, food: "10091", grams: 2, extra: [{ foodId: "17007", grams: 2 }] }
    - { id: tarako, name: たらこ, kana: たらこ, food: "10203", grams: 10 } # たらこ 焼き
    - { id: mentaiko, name: 明太子, kana: めんたいこ, food: "10204", grams: 10 }
    - { id: takana, name: 高菜, kana: たかな, food: "06148", grams: 10 }

# 温かいうどん（ゆでうどん1玉＋つゆ＋具）。つゆはかけうどんと同じで、飲み干す前提
- template: udon
  name: "{name}うどん"
  kana: "{kana}うどん"
  category: noodle
  suggestedSlots: [lunch, dinner]
  ingredients:
    - { foodId: "01039", grams: 230, role: めん } # ゆでうどん1玉
    - { foodId: "17021", grams: 300 } # かつお・昆布だし
    - { foodId: "17008", grams: 18 } # うすくちしょうゆ
    - { foodId: "16025", grams: 10 } # 本みりん
    - { foodId: "17012", grams: 1 } # 食塩
    - { foodId: "06226", grams: 5 } # ねぎ
    - { foodId: "{food}", grams: "{grams}", role: 具 }
  variants:
    - { id: kitsune, name: きつね, kana: きつね, food: "04040", grams: 20, extra: [{ foodId: "03003", grams: 4 }, { foodId: "17007", grams: 4 }] } # 油揚げの甘煮
    - { id: tanuki, name: たぬき, kana: たぬき, food: "01172", grams: 10 } # 天かす（天ぷら用バッター 揚げ）
    - { id: tsukimi, name: 月見, kana: つきみ, food: "12004", grams: 50 }
    - { id: tempura, name: 天ぷら, kana: てんぷら えびてん, food: "10416", grams: 60 } # えびの天ぷら2本
    - { id: niku, name: 肉, kana: にく, food: "11046", grams: 50, extra: [{ foodId: "03003", grams: 4 }, { foodId: "17007", grams: 6 }] } # 牛ばらの甘辛煮
    - { id: wakame, name: わかめ, kana: わかめ, food: "09045", grams: 20 }

