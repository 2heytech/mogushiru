    - { id: hamachi, name: はまち, kana: はまち, food: "10243", grams: 60 } # ぶり はまち 養殖 生
    - { id: tai, name: たい, kana: たい まだい, food: "10193", grams: 60 } # まだい 養殖 生
    - { id: katsuo, name: かつお, kana: かつお, food: "10086", grams: 70 } # かつお 春獲り 生
    - { id: ika, name: いか, kana: いか, food: "10345", grams: 50 } # するめいか 生
    - { id: tako, name: たこ, kana: たこ, food: "10362", grams: 50 } # まだこ ゆで
    - { id: hotate, name: ほたて, kana: ほたて ほたてがい, food: "10313", grams: 50 } # ほたてがい 貝柱 生
    - { id: amaebi, name: 甘えび, kana: あまえび, food: "10319", grams: 40 } # あまえび 生

# 肉の焼き物（塩・こしょう）
- template: grill
  name: "{name}"
  kana: "{kana}"
  category: main
  suggestedSlots: [lunch, dinner]
  ingredients:
    - { foodId: "{food}", grams: "{grams}", role: 肉 }
    - { foodId: "17012", grams: 0.8 } # 食塩
    - { foodId: "17065", grams: 0.1 } # こしょう
  variants:
    - { id: steak, name: ビーフステーキ, kana: すてーき びーふすてーき, food: "11043", grams: 150, alternatives: ["11015", "11045"], extra: [{ foodId: "14006", grams: 3 }] } # 乳用肥育牛 サーロイン 脂身つき 生。和牛は 11015
    - { id: chicken-saute, name: チキンソテー, kana: ちきんそてー, food: "11222", grams: 100, extra: [{ foodId: "14006", grams: 3 }] } # 若どり もも 皮つき 焼き
    - { id: chicken-breast, name: 鶏むね肉のソテー, kana: とりむねにくのそてー, food: "11287", grams: 100, extra: [{ foodId: "14006", grams: 3 }] } # 若どり むね 皮つき 焼き

