# 副菜・汁物
- id: ohitashi
  name: ほうれん草のおひたし
  kana: ほうれんそうのおひたし
  category: side
  suggestedSlots: [breakfast, lunch, dinner]
  ingredients:
    - { foodId: "06268", grams: 70, role: 青菜 } # ほうれんそう ゆで
    - { foodId: "17007", grams: 4 } # こいくちしょうゆ
    - { foodId: "17021", grams: 5 } # だし
    - { foodId: "10091", grams: 0.5 } # かつお節
  recipe:
    minutes: 10
    steps:
      - "鍋にたっぷりの湯をわかし、ほうれんそうを根元から入れて1分ほどゆでる。"
      - "冷水にとって冷まし、水気をしっかりしぼって4cmの長さに切る。"
      - "だしとしょうゆをまぜてかけ、かつお節をのせる。"

- id: green-salad
  name: グリーンサラダ
  kana: ぐりーんさらだ やさいさらだ
  category: side
  suggestedSlots: [breakfast, lunch, dinner]
  ingredients:
    - { foodId: "06312", grams: 30 } # レタス
    - { foodId: "06182", grams: 40 } # トマト
    - { foodId: "06065", grams: 20 } # きゅうり
    - { foodId: "17116", grams: 12, role: ドレッシング, alternatives: ["17039", "17117", "17042"] } # 和風ドレッシング
  recipe:
    minutes: 10
    steps:
      - "レタスは食べやすくちぎって冷水につけ、パリッとさせて水気をきる。"
      - "トマトはくし形に切り、きゅうりは斜め薄切りにする。"
      - "器に盛りあわせ、食べる直前に和風ドレッシングをかける。"

- id: kinpira
  name: きんぴらごぼう
  kana: きんぴらごぼう
  category: side
  suggestedSlots: [lunch, dinner]
  ingredients:
    - { foodId: "06084", grams: 40 } # ごぼう
    - { foodId: "06214", grams: 10 } # にんじん
    - { foodId: "14002", grams: 3 } # ごま油
    - { foodId: "17007", grams: 4.5 } # こいくちしょうゆ（成分表そう菜10の配合 5.2%[1.6〜7.5%] に合わせ 6g から減らした）
    - { foodId: "03003", grams: 3 } # 上白糖
    - { foodId: "16025", grams: 3 } # 本みりん
    - { foodId: "05018", grams: 1 } # いりごま
  recipe:
    minutes: 15
    steps:
      - "ごぼうとにんじんは細切りにする。ごぼうは水に5分さらして水気をきる。"
      - "フライパンにごま油を入れて中火で熱し、ごぼうとにんじんを3〜4分炒める。"
      - "砂糖、みりん、しょうゆを加え、汁気がなくなるまで炒める。"
      - "器に盛り、ごまをふる。"

- id: yasai-itame
  name: 野菜炒め
  kana: やさいいため
  category: side
  suggestedSlots: [lunch, dinner]
  ingredients:
    - { foodId: "06061", grams: 80 } # キャベツ
    - { foodId: "06291", grams: 50 } # もやし
    - { foodId: "06214", grams: 15 } # にんじん
    - { foodId: "11129", grams: 30, role: 肉, alternatives: ["11221"] } # 豚ばら
    - { foodId: "14006", grams: 5 } # 調合油
    - { foodId: "17012", grams: 0.8 } # 食塩
    - { foodId: "17007", grams: 3 } # こいくちしょうゆ
  recipe:
    minutes: 15
    steps:
      - "キャベツはざく切り、にんじんは短冊切り、豚肉は3cm幅に切る。もやしは洗って水気をきる。"
      - "フライパンにサラダ油を入れて強めの中火で熱し、豚肉を炒める。色が変わったら、にんじん、キャベツの芯を加えて炒める。"
      - "キャベツの葉ともやしを加えて手早く炒め、塩としょうゆで味をととのえる。"

- id: miso-soup
  name: 豆腐とわかめのみそ汁
  kana: みそしる おみそしる
  category: soup
  suggestedSlots: [breakfast, lunch, dinner]
  ingredients:
    - { foodId: "17021", grams: 150 } # だし
    - { foodId: "17045", grams: 12, role: みそ, alternatives: ["17044", "17145"] } # 淡色辛みそ
    - { foodId: "04033", grams: 30 } # 絹ごし豆腐
    - { foodId: "09044", grams: 1 } # カットわかめ 乾
    - { foodId: "06226", grams: 3 } # ねぎ
  recipe:
    minutes: 10
    steps:
      - "豆腐は1.5cm角に切り、長ねぎは小口切りにする。"
      - "鍋にだしを入れて中火で温め、豆腐とわかめを入れてひと煮立ちさせる。"
      - "火を弱めてみそを溶き入れ、煮立つ直前に火を止める。"
      - "おわんに盛り、長ねぎをのせる。"

- id: tonjiru
  name: 豚汁
  kana: とんじる ぶたじる
  category: soup
  suggestedSlots: [breakfast, lunch, dinner]
  ingredients:
    - { foodId: "17021", grams: 160 } # だし
    - { foodId: "11129", grams: 20, role: 肉 } # 豚ばら
    - { foodId: "06134", grams: 30 } # だいこん
    - { foodId: "06214", grams: 10 } # にんじん
    - { foodId: "06084", grams: 10 } # ごぼう
    - { foodId: "06226", grams: 5 } # ねぎ
    - { foodId: "17045", grams: 15, role: みそ } # 淡色辛みそ
  recipe:
    minutes: 25
    steps:
      - "だいこんとにんじんはいちょう切り、ごぼうはささがきにして水にさらす。長ねぎは小口切り、肉は3cm幅に切る。"
      - "鍋にだし、だいこん、にんじん、ごぼうを入れて中火にかける。"
      - "煮立ったら肉をほぐしながら加え、アクをとる。弱めの中火で10分ほど、野菜がやわらかくなるまで煮る。"
      - "火を弱めてみそを溶き入れ、長ねぎを加えてひと煮立ちさせる。"

