name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI は読むだけ（コードの取得）なので、GitHub の鍵（GITHUB_TOKEN）には読む権限だけを渡す
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
